<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Inspección de Soldadura</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3864">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>Registro de Inspección</h1>
    <div id="connStatus" class="status status--offline">
      <span class="dot"></span><span class="statusText">Sin conexión</span>
    </div>
  </div>
</header>

<main class="wrap">

  <section id="pendingBanner" class="banner" hidden>
    <span id="pendingCount">0</span> registro(s) pendiente(s) por sincronizar
    <button id="syncBtn" type="button" class="btn btn--small">Sincronizar ahora</button>
  </section>

  <form id="inspectionForm" novalidate>

    <div class="grid">

      <div class="field">
        <label for="fecha">Fecha de inspección</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <div class="field">
        <label for="proyecto">Proyecto (Fase)</label>
        <select id="proyecto" name="proyecto" required></select>
      </div>

      <div class="field">
        <label for="marca">Marca del elemento</label>
        <input type="text" id="marca" name="marca" placeholder="Ej: V-101" required>
      </div>

      <div class="field">
        <label for="cantidad">Cantidad revisada</label>
        <input type="number" id="cantidad" name="cantidad" min="0" step="1" required>
      </div>

      <div class="field">
        <label for="correlativos">Correlativos</label>
        <input type="text" id="correlativos" name="correlativos" placeholder="Ej: 001-015">
      </div>

      <div class="field">
        <label for="area">Área</label>
        <select id="area" name="area" required></select>
      </div>

      <div class="field">
        <label for="etapa">Etapa</label>
        <select id="etapa" name="etapa" required></select>
      </div>

      <div class="field">
        <label for="armador">Armador</label>
        <select id="armador" name="armador" required></select>
      </div>

      <div class="field">
        <label for="soldador">Soldador</label>
        <select id="soldador" name="soldador" required></select>
      </div>

      <div class="field">
        <label for="responsable">Responsable</label>
        <select id="responsable" name="responsable" required></select>
      </div>

      <div class="field">
        <label for="codigoRespuesta">Código respuesta</label>
        <select id="codigoRespuesta" name="codigoRespuesta" required></select>
      </div>

      <div class="field">
        <label for="resultado">Resultado</label>
        <select id="resultado" name="resultado" required></select>
      </div>

      <div class="field">
        <label for="reparado">Reparado</label>
        <select id="reparado" name="reparado" required></select>
      </div>

      <div class="field">
        <label for="areaNC">Área donde se detecta NC</label>
        <select id="areaNC" name="areaNC"></select>
      </div>

      <div class="field field--wide">
        <label>Defectos detectados</label>
        <div id="defectosGroup" class="checkgroup"></div>
      </div>

      <div class="field field--wide">
        <label for="detalleDefectos">Detalle de defectos</label>
        <textarea id="detalleDefectos" name="detalleDefectos" rows="3" placeholder="Descripción detallada de los defectos encontrados"></textarea>
      </div>

      <div class="field field--wide">
        <label for="evidencia">Evidencia fotográfica</label>
        <input type="file" id="evidencia" name="evidencia" accept="image/*" capture="environment">
        <p id="evidenciaHint" class="hint">Solo disponible con conexión a internet (se sube directo a Drive).</p>
        <div id="evidenciaPreview" class="preview" hidden><img id="evidenciaImg" alt="Vista previa"></div>
      </div>

      <div class="field">
        <label for="inspector">Inspector</label>
        <select id="inspector" name="inspector" required></select>
      </div>

    </div>

    <div class="actions">
      <button type="reset" class="btn btn--ghost">Limpiar</button>
      <button type="submit" class="btn btn--primary" id="submitBtn">Guardar registro</button>
    </div>

    <p id="formMsg" class="formMsg" role="status" aria-live="polite"></p>

  </form>
</main>

<script src="app.js"></script>
</body>
</html>
